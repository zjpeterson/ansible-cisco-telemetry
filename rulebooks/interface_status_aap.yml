---
- name: Remediate interface status
  hosts: all

  sources:
    - ansible.eda.kafka:
        host: localhost
        port: 9092
        topic: eda

  rules:
    - name: Re-apply config when interface not up
      condition:
        all:
          - event.body.fields.admin_status != "if-state-up"
          - event.body.tags.name == 'Tunnel1'
      action:
        run_job_template:
          name: Router configuration
          organization: Default
