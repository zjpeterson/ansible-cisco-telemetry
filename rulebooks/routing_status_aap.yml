---
- name: Remediate routing status
  hosts: all

  sources:
    - ansible.eda.kafka:
        host: localhost
        port: 9092
        topic: eda

  rules:
    - name: Re-apply config when interface not up
      condition: event.body.fields.admin_status != "if-state-up" and event.body.tags.name == 'Tunnel0'
      action:
        run_job_template:
          name: Router configuration
          organization: Default

    - name: Re-apply config when BGP not established
      condition: event.body.fields['connection/state'] != "established"
      action:
        run_job_template:
          name: Router configuration
          organization: Default
          job_args:
            limit: event.body.tags.source
